{% if inline_form %}
<div class="card mb-3 shadow-sm">
    <div class="card-header bg-{{ 'success' if confirmation_doc else 'primary' }} text-white py-2">
        <h6 class="mb-0">
            <i class="fas {% if service_item.service_type == 'FLIGHT' %}fa-plane{% elif service_item.service_type == 'HOTEL' %}fa-hotel{% elif service_item.service_type == 'TRANSPORT' %}fa-taxi{% elif service_item.service_type == 'VISA' %}fa-passport{% elif service_item.service_type == 'INSURANCE' %}fa-shield-alt{% else %}fa-briefcase{% endif %} me-2"></i>
            {{ 'Update' if confirmation_doc else 'Confirm' }} {{ service_item.service_type|capitalize }} Service
        </h6>
    </div>
    <div class="card-body">
        <form action="{{ url_for('booking.confirm_service', item_id=service_item.id) }}" method="post" id="confirmForm-{{ service_item.id }}">
            <input type="hidden" name="service_type" value="{{ service_item.service_type }}">
            
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Confirmation Reference</label>
                    <input type="text" name="confirmation_reference" class="form-control" value="{{ confirmation_data.confirmation_reference }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Supplier</label>
                    <select name="supplier" class="form-select" required>
                        <option value="">-- Select Supplier --</option>
                        {% block supplier_options %}
                        <option value="General Supplier">General Supplier</option>
                        {% endblock %}
                    </select>
                </div>
            </div>
            
            {% block form_fields %}
            <!-- Service-specific form fields will be included here -->
            {% endblock %}
            
            <div class="mt-3">
                <button type="submit" class="btn btn-{{ 'success' if not confirmation_doc else 'primary' }}">
                    <i class="fas fa-{{ 'check' if not confirmation_doc else 'save' }} me-1"></i>
                    {{ 'Confirm' if not confirmation_doc else 'Update' }} {{ service_item.service_type|capitalize }}
                </button>
                <button type="button" class="btn btn-outline-secondary ms-2 cancel-confirm-btn" data-service-id="{{ service_item.id }}">
                    <i class="fas fa-times me-1"></i> Cancel
                </button>
            </div>
        </form>
    </div>
</div>
{% else %}
<!-- Content for standalone form pages (not inline) -->
<h1>Error: This template is meant to be used with inline_form=True</h1>
{% endif %}
