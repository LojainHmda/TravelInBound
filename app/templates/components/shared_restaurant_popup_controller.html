<script>
(function () {
    const RESTAURANT_OTHER_CONFIG = [
        { id: 'new_restaurant_payment_terms', key: 'restaurant_payment_terms' },
        { id: 'new_restaurant_default_currency', key: 'restaurant_default_currency' }
    ];

    function ensureOption(selectEl, value) {
        const val = String(value || '').trim();
        if (!selectEl || !val) return false;
        const exists = Array.from(selectEl.options).some(opt => (opt.value || '').toLowerCase() === val.toLowerCase());
        if (exists) return false;
        const option = document.createElement('option');
        option.value = val;
        option.textContent = val;
        const otherOption = Array.from(selectEl.options).find(opt => opt.value === 'Other');
        if (otherOption) selectEl.insertBefore(option, otherOption);
        else selectEl.appendChild(option);
        return true;
    }

    function openCustomPrompt(message, onSubmit) {
        const existingOverlay = document.getElementById('custom-prompt-overlay');
        if (existingOverlay) existingOverlay.remove();
        const overlay = document.createElement('div');
        overlay.id = 'custom-prompt-overlay';
        overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:99999;';
        const dialog = document.createElement('div');
        dialog.style.cssText = 'background:white;border-radius:12px;padding:24px;min-width:360px;max-width:460px;box-shadow:0 20px 60px rgba(0,0,0,0.3);';
        dialog.innerHTML = `
            <div style="font-size:14px;font-weight:600;color:#1e293b;margin-bottom:12px;">${message}</div>
            <input type="text" id="custom-prompt-input" style="width:100%;padding:8px 12px;border:1px solid #cbd5e1;border-radius:6px;font-size:13px;outline:none;box-sizing:border-box;" placeholder="Type value..." autofocus>
            <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px;">
                <button type="button" id="custom-prompt-cancel" style="padding:6px 16px;border:1px solid #cbd5e1;border-radius:6px;background:#f8fafc;color:#475569;font-size:12px;cursor:pointer;">Cancel</button>
                <button type="button" id="custom-prompt-ok" style="padding:6px 16px;border:none;border-radius:6px;background:#3b82f6;color:white;font-size:12px;cursor:pointer;font-weight:500;">Add</button>
            </div>
        `;
        overlay.appendChild(dialog);
        document.body.appendChild(overlay);
        const input = document.getElementById('custom-prompt-input');
        const okBtn = document.getElementById('custom-prompt-ok');
        const cancelBtn = document.getElementById('custom-prompt-cancel');
        const submit = () => {
            const value = (input?.value || '').trim();
            overlay.remove();
            onSubmit(value);
        };
        const cancel = () => overlay.remove();
        okBtn?.addEventListener('click', submit);
        cancelBtn?.addEventListener('click', cancel);
        input?.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') submit();
            if (e.key === 'Escape') cancel();
        });
        overlay.addEventListener('click', function (e) {
            if (e.target === overlay) cancel();
        });
        setTimeout(() => input?.focus(), 50);
    }

    async function fetchGlobalOptionValues(key) {
        try {
            const resp = await fetch(`/inbound/api/supplier-option-values/global?key=${encodeURIComponent(key)}`);
            const data = await resp.json();
            if (data && data.success && Array.isArray(data.values)) return data.values;
        } catch (_) {}
        return [];
    }

    async function persistGlobalOptionValue(key, value) {
        const v = String(value || '').trim();
        if (!key || !v) return false;
        try {
            const resp = await fetch('/inbound/api/supplier-option-values/global', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ key: key, value: v })
            });
            const data = await resp.json();
            return !!(resp.ok && data && data.success);
        } catch (_) {
            return false;
        }
    }

    async function hydrateRestaurantOthers() {
        for (const cfg of RESTAURANT_OTHER_CONFIG) {
            const selectEl = document.getElementById(cfg.id);
            if (!selectEl) continue;
            const values = await fetchGlobalOptionValues(cfg.key);
            values.forEach(v => ensureOption(selectEl, v));
            if (selectEl.dataset.otherHandlerAttached === '1') continue;
            selectEl.dataset.otherHandlerAttached = '1';
            selectEl.addEventListener('change', function () {
                if (selectEl.value !== 'Other') return;
                openCustomPrompt('Enter new value:', async function (customValue) {
                    const val = String(customValue || '').trim();
                    if (!val) {
                        selectEl.value = '';
                        return;
                    }
                    ensureOption(selectEl, val);
                    selectEl.value = val;
                    await persistGlobalOptionValue(cfg.key, val);
                });
            });
        }
    }

    function buildSupplierFormData(payload, fileInputId) {
        const formData = new FormData();
        Object.keys(payload || {}).forEach(key => {
            formData.append(key, payload[key] == null ? '' : String(payload[key]));
        });
        const fileInput = fileInputId ? document.getElementById(fileInputId) : null;
        if (fileInput && fileInput.files && fileInput.files[0]) {
            formData.append('contract_file', fileInput.files[0]);
        }
        return formData;
    }

    function applyCliqAndContractToSupplierDialog(prefix) {
        if (typeof window.bindSupplierPaymentMethodFields === 'function') {
            window.bindSupplierPaymentMethodFields(prefix);
        }
        const taxInput = document.getElementById(`${prefix}_tax_number`);
        const bankAccountInput = document.getElementById(`${prefix}_bank_account`);
        if (!taxInput || !bankAccountInput) return;
        const taxWrap = taxInput.closest('div');
        if (!taxWrap) return;

        const existingContractInput = document.getElementById(`${prefix}_contract_file`);
        let contractWrap = document.getElementById(`${prefix}_contract_wrap`);
        if (!existingContractInput && !contractWrap) {
            contractWrap = document.createElement('div');
            contractWrap.id = `${prefix}_contract_wrap`;
            const labelClass = 'block text-xs font-medium text-slate-700 mb-0.5';
            contractWrap.innerHTML = `
                <label class="${labelClass}">Contract Attachment</label>
                <div style="display:flex;align-items:center;gap:6px;">
                    <input type="file" id="${prefix}_contract_file" class="${bankAccountInput.className || ''}" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" style="flex:1;min-width:0;">
                    <button type="button" id="${prefix}_clear_file" style="display:none;padding:2px 6px;background:#f1f5f9;border:1px solid #cbd5e1;border-radius:3px;cursor:pointer;font-size:0.7rem;color:#475569;white-space:nowrap;transition:background-color 0.2s;height:fit-content;flex-shrink:0;" onmouseover="this.style.backgroundColor='#e2e8f0'" onmouseout="this.style.backgroundColor='#f1f5f9'">Clear</button>
                </div>
            `;
            taxWrap.insertAdjacentElement('afterend', contractWrap);

            const fileInput = document.getElementById(`${prefix}_contract_file`);
            const clearBtn = document.getElementById(`${prefix}_clear_file`);
            let originalFile = null;
            let originalUrl = null;
            let currentBlobUrl = null;

            fileInput.addEventListener('change', function() {
                // Only process if a file is actually selected
                if (!this.files || this.files.length === 0) {
                    // File picker was opened but closed without selecting - keep existing file
                    return;
                }

                const file = this.files[0];
                if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
                currentBlobUrl = URL.createObjectURL(file);
                clearBtn.style.display = 'block';
            });

            clearBtn.addEventListener('click', function(e) {
                e.preventDefault();
                fileInput.value = '';
                if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
                currentBlobUrl = null;
                clearBtn.style.display = originalFile ? 'block' : 'none';
            });

            // Make filename clickable to preview
            fileInput.addEventListener('click', function(e) {
                if ((currentBlobUrl || originalUrl) && e.offsetX > 80 && e.offsetY < 24) {
                    const urlToOpen = currentBlobUrl || originalUrl;
                    window.open(urlToOpen, '_blank');
                    e.preventDefault();
                }
            });
        }
    }

    function initRestaurantPopupEnhancements() {
        applyCliqAndContractToSupplierDialog('new_restaurant');
        hydrateRestaurantOthers();
    }

    window.openAddRestaurantModal = function openAddRestaurantModal() {
        const modal = document.getElementById('addRestaurantModal');
        if (!modal) return;
        modal.classList.remove('hidden');
        modal.classList.add('flex');
        modal.style.display = 'flex';
        initRestaurantPopupEnhancements();
        document.getElementById('new_restaurant_name')?.focus();
    };

    window.closeAddRestaurantModal = function closeAddRestaurantModal() {
        const modal = document.getElementById('addRestaurantModal');
        if (!modal) return;
        modal.classList.add('hidden');
        modal.classList.remove('flex');
        modal.style.display = 'none';
        document.getElementById('new_restaurant_name').value = '';
        document.getElementById('new_restaurant_location').value = '';
        document.getElementById('new_restaurant_city').value = '';
        document.getElementById('new_restaurant_country').value = 'Jordan';
        document.getElementById('new_restaurant_contact_person').value = '';
        document.getElementById('new_restaurant_phone').value = '';
        document.getElementById('new_restaurant_email').value = '';
        document.getElementById('new_restaurant_website').value = '';
        document.getElementById('new_restaurant_payment_terms').value = '';
        document.getElementById('new_restaurant_payment_method').value = '';
        document.getElementById('new_restaurant_default_currency').value = 'USD';
        document.getElementById('new_restaurant_address').value = '';
        document.getElementById('new_restaurant_bank_name').value = '';
        document.getElementById('new_restaurant_bank_account').value = '';
        const restCliq = document.getElementById('new_restaurant_cliq_alias');
        if (restCliq) restCliq.value = '';
        if (typeof window.syncSupplierPaymentMethodFields === 'function') {
            window.syncSupplierPaymentMethodFields('new_restaurant');
        }
        const restContract = document.getElementById('new_restaurant_contract_file');
        if (restContract) restContract.value = '';
        document.getElementById('new_restaurant_tax_number').value = '';
        document.getElementById('new_restaurant_notes').value = '';
        document.getElementById('add-restaurant-error')?.classList.add('hidden');
    };

    window.saveNewRestaurant = function saveNewRestaurant() {
        const restaurantName = document.getElementById('new_restaurant_name').value.trim();
        if (!restaurantName) {
            const err = document.getElementById('add-restaurant-error');
            if (err) {
                err.textContent = 'Please enter a restaurant name';
                err.classList.remove('hidden');
            }
            return;
        }
        const financial = getSupplierDialogFinancialFields('new_restaurant');
        const restaurantData = {
            name: restaurantName,
            location: document.getElementById('new_restaurant_location').value.trim(),
            city: document.getElementById('new_restaurant_city').value.trim(),
            country: document.getElementById('new_restaurant_country').value.trim(),
            contact_person: document.getElementById('new_restaurant_contact_person').value.trim(),
            phone: document.getElementById('new_restaurant_phone').value.trim(),
            email: document.getElementById('new_restaurant_email').value.trim(),
            website: document.getElementById('new_restaurant_website').value.trim(),
            payment_terms: financial.payment_terms,
            payment_method: financial.payment_method || '',
            default_currency: document.getElementById('new_restaurant_default_currency').value.trim() || 'USD',
            address: document.getElementById('new_restaurant_address').value.trim(),
            bank_name: financial.bank_name,
            bank_account: financial.bank_account,
            cliq_alias: financial.cliq_alias,
            tax_number: document.getElementById('new_restaurant_tax_number').value.trim(),
            notes: document.getElementById('new_restaurant_notes').value.trim()
        };
        const csrfVal = (typeof window.csrfToken !== 'undefined' ? window.csrfToken : '') || '';
        const headers = csrfVal ? { 'X-CSRFToken': csrfVal } : {};
        fetch('/inbound/api/add-restaurant', {
            method: 'POST',
            headers: headers,
            body: buildSupplierFormData(restaurantData, 'new_restaurant_contract_file')
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                const mealSelect = document.getElementById('meal_restaurant');
                if (mealSelect) {
                    const separator = mealSelect.querySelector('optgroup[label="──────────"]');
                    const option = document.createElement('option');
                    option.value = data.supplier_id;
                    option.textContent = restaurantName;
                    if (separator) mealSelect.insertBefore(option, separator);
                    else mealSelect.appendChild(option);
                    mealSelect.value = data.supplier_id;
                }
                const itinerarySelects = document.querySelectorAll('#itineraryTableBody select[data-field="restaurant_supplier_id"]');
                itinerarySelects.forEach(select => {
                    const exists = Array.from(select.options).some(opt => String(opt.value) === String(data.supplier_id));
                    if (exists) return;
                    const separator = select.querySelector('optgroup[label="──────────"]');
                    const option = document.createElement('option');
                    option.value = data.supplier_id;
                    option.textContent = restaurantName;
                    if (separator) select.insertBefore(option, separator);
                    else select.appendChild(option);
                });
                window.closeAddRestaurantModal();
                if (typeof showNotification === 'function') {
                    showNotification('Restaurant added successfully', 'success');
                }
                if (!mealSelect && itinerarySelects.length === 0) window.location.reload();
            } else {
                const err = document.getElementById('add-restaurant-error');
                if (err) {
                    err.textContent = data.error || 'Error adding restaurant';
                    err.classList.remove('hidden');
                }
            }
        })
        .catch(() => {
            const err = document.getElementById('add-restaurant-error');
            if (err) {
                err.textContent = 'Error adding restaurant';
                err.classList.remove('hidden');
            }
        });
    };
})();
</script>
