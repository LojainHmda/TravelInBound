<!-- Customer Selection Modal with Search -->
<div class="modal fade" id="customerSelectionModal" tabindex="-1" aria-labelledby="customerSelectionModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-dark text-white">
                <h5 class="modal-title" id="customerSelectionModalLabel">
                    <i class="fas fa-users me-2"></i>Select Customer
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <!-- Search Filter -->
                <div class="mb-3">
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fas fa-search"></i>
                        </span>
                        <input type="text" class="form-control" id="customerSelectionSearchInput" 
                               placeholder="Search by name, email, phone, or company..." 
                               autocomplete="off">
                        <button class="btn btn-outline-secondary" type="button" id="clearSearchBtn">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                </div>
                
                <!-- Quick Filter Buttons -->
                <div class="mb-3">
                    <div class="btn-group" role="group" aria-label="Customer filters">
                        <button type="button" class="btn btn-outline-primary btn-sm filter-btn active" data-filter="all">
                            <i class="fas fa-globe"></i> All
                        </button>
                        <button type="button" class="btn btn-outline-primary btn-sm filter-btn" data-filter="recent">
                            <i class="fas fa-clock"></i> Recent
                        </button>
                        <button type="button" class="btn btn-outline-primary btn-sm filter-btn" data-filter="frequent">
                            <i class="fas fa-star"></i> Frequent
                        </button>
                    </div>
                </div>
                
                <!-- Customer List -->
                <div class="customer-list-container" style="max-height: 400px; overflow-y: auto;">
                    <div id="customerListLoader" class="text-center py-4">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading customers...</span>
                        </div>
                        <div class="mt-2 text-muted">Loading customers...</div>
                    </div>
                    
                    <div id="customerList" class="d-none">
                        <!-- Customer items will be populated here -->
                    </div>
                    
                    <div id="noCustomersFound" class="text-center py-4 d-none">
                        <i class="fas fa-user-slash text-muted" style="font-size: 3rem;"></i>
                        <div class="mt-3 text-muted">No customers found</div>
                        <button type="button" class="btn btn-primary btn-sm mt-2" onclick="showNewCustomerForm()">
                            <i class="fas fa-plus"></i> Add New Customer
                        </button>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                    <i class="fas fa-times"></i> Cancel
                </button>
                <button type="button" class="btn btn-success" onclick="showNewCustomerForm()">
                    <i class="fas fa-plus"></i> Add New Customer
                </button>
            </div>
        </div>
    </div>
</div>

<style>
.customer-item {
    border: 1px solid #dee2e6;
    border-radius: 8px;
    padding: 15px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: all 0.2s ease;
    background-color: white;
}

.customer-item:hover {
    border-color: #0d6efd;
    box-shadow: 0 2px 8px rgba(13, 110, 253, 0.15);
    transform: translateY(-1px);
}

.customer-item.selected {
    border-color: #0d6efd;
    background-color: #f8f9ff;
    box-shadow: 0 2px 8px rgba(13, 110, 253, 0.25);
}

.customer-name {
    font-weight: 600;
    color: #212529;
    font-size: 1.1rem;
}

.customer-details {
    color: #6c757d;
    font-size: 0.9rem;
    margin-top: 5px;
}

.customer-meta {
    display: flex;
    gap: 15px;
    margin-top: 8px;
    font-size: 0.85rem;
}

.customer-meta-item {
    display: flex;
    align-items: center;
    gap: 4px;
    color: #6c757d;
}

.customer-stats {
    background-color: #f8f9fa;
    border-radius: 4px;
    padding: 4px 8px;
    font-size: 0.75rem;
    color: #495057;
}

.filter-btn.active {
    background-color: #0d6efd;
    color: white;
    border-color: #0d6efd;
}

#customerSelectionSearchInput:focus {
    border-color: #0d6efd;
    box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.25);
}
</style>

<script>
let allCustomers = [];
let filteredCustomers = [];
let selectedCustomerId = null;
let currentFilter = 'all';

// Customer selection modal functions
function openCustomerSelectionModal(callback) {
    window.customerSelectionCallback = callback;
    selectedCustomerId = null;
    
    // Show modal
    const modal = new bootstrap.Modal(document.getElementById('customerSelectionModal'));
    modal.show();
    
    // Load customers
    loadCustomers();
}

function loadCustomers() {
    // Show loader
    document.getElementById('customerListLoader').classList.remove('d-none');
    document.getElementById('customerList').classList.add('d-none');
    document.getElementById('noCustomersFound').classList.add('d-none');
    
    // Fetch customers from API
    fetch('/api/customers')
        .then(response => response.json())
        .then(data => {
            allCustomers = data.customers || [];
            applyCurrentFilter();
            hideLoader();
        })
        .catch(error => {
            console.error('Error loading customers:', error);
            hideLoader();
            showNoCustomersFound();
        });
}

function hideLoader() {
    document.getElementById('customerListLoader').classList.add('d-none');
}

function applyCurrentFilter() {
    let filtered = [...allCustomers];
    
    // Apply filter
    switch(currentFilter) {
        case 'recent':
            // Sort by created date (most recent first)
            filtered = filtered.sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0)).slice(0, 20);
            break;
        case 'frequent':
            // Sort by booking count (most frequent first)
            filtered = filtered.sort((a, b) => (b.booking_count || 0) - (a.booking_count || 0)).slice(0, 20);
            break;
        default:
            // All customers - sort alphabetically
            filtered = filtered.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
    }
    
    filteredCustomers = filtered;
    renderCustomerList();
}

function renderCustomerList() {
    const customerList = document.getElementById('customerList');
    const searchTerm = document.getElementById('customerSelectionSearchInput').value.toLowerCase();
    
    // Filter by search term
    let displayCustomers = filteredCustomers;
    if (searchTerm) {
        displayCustomers = filteredCustomers.filter(customer => 
            (customer.name || '').toLowerCase().includes(searchTerm) ||
            (customer.email || '').toLowerCase().includes(searchTerm) ||
            (customer.phone || '').toLowerCase().includes(searchTerm) ||
            (customer.company || '').toLowerCase().includes(searchTerm)
        );
    }
    
    if (displayCustomers.length === 0) {
        showNoCustomersFound();
        return;
    }
    
    // Render customer items
    customerList.innerHTML = displayCustomers.map(customer => `
        <div class="customer-item" onclick="selectCustomer(${customer.id})" data-customer-id="${customer.id}">
            <div class="customer-name">${customer.name || 'Unnamed Customer'}</div>
            <div class="customer-details">
                ${customer.email || ''} ${customer.phone ? '• ' + customer.phone : ''}
                ${customer.company ? '• ' + customer.company : ''}
            </div>
            <div class="customer-meta">
                <div class="customer-meta-item">
                    <i class="fas fa-calendar"></i>
                    <span>${customer.created_at ? new Date(customer.created_at).toLocaleDateString() : 'N/A'}</span>
                </div>
                <div class="customer-meta-item">
                    <i class="fas fa-suitcase"></i>
                    <span class="customer-stats">${customer.booking_count || 0} bookings</span>
                </div>
                ${customer.nationality ? `
                <div class="customer-meta-item">
                    <i class="fas fa-flag"></i>
                    <span>${customer.nationality}</span>
                </div>
                ` : ''}
            </div>
        </div>
    `).join('');
    
    customerList.classList.remove('d-none');
    document.getElementById('noCustomersFound').classList.add('d-none');
}

function showNoCustomersFound() {
    document.getElementById('customerList').classList.add('d-none');
    document.getElementById('noCustomersFound').classList.remove('d-none');
}

function selectCustomer(customerId) {
    selectedCustomerId = customerId;
    
    // Update visual selection
    document.querySelectorAll('.customer-item').forEach(item => {
        item.classList.remove('selected');
    });
    
    const selectedItem = document.querySelector(`[data-customer-id="${customerId}"]`);
    if (selectedItem) {
        selectedItem.classList.add('selected');
    }
    
    // Find customer data
    const customer = allCustomers.find(c => c.id === customerId);
    
    // Close modal and call callback
    const modal = bootstrap.Modal.getInstance(document.getElementById('customerSelectionModal'));
    modal.hide();
    
    if (window.customerSelectionCallback && customer) {
        window.customerSelectionCallback(customer);
    }
}

function showNewCustomerForm() {
    const modal = bootstrap.Modal.getInstance(document.getElementById('customerSelectionModal'));
    modal.hide();
    
    // Redirect to new customer form or open new customer modal
    // This depends on your implementation
    window.location.href = '/customers/new';
}

// Event listeners
document.addEventListener('DOMContentLoaded', function() {
    // Search input
    const searchInput = document.getElementById('customerSelectionSearchInput');
    if (searchInput) {
        searchInput.addEventListener('input', function() {
            renderCustomerList();
        });
    }
    
    // Clear search button
    const clearBtn = document.getElementById('clearSearchBtn');
    if (clearBtn) {
        clearBtn.addEventListener('click', function() {
            searchInput.value = '';
            renderCustomerList();
        });
    }
    
    // Filter buttons
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            // Update active state
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            
            // Apply filter
            currentFilter = this.dataset.filter;
            applyCurrentFilter();
        });
    });
});
</script>
