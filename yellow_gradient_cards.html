<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yellow Gradient Cards</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
        }
        
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        /* Cards container */
        .cards-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }
        
        /* Card styling */
        .card {
            width: 220px;
            height: 200px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }
        
        /* Yellow gradient variations */
        .yellow-gradient-1 {
            background: linear-gradient(to bottom, #fff9e6, #ffe082);
        }
        
        .yellow-gradient-2 {
            background: linear-gradient(to bottom, #fff8dd, #ffd761);
        }
        
        .yellow-gradient-3 {
            background: linear-gradient(to bottom, #fff8d1, #ffcf3d);
        }
        
        .yellow-gradient-4 {
            background: linear-gradient(to bottom, #f0f7d3, #cde58f);
        }
        
        /* Card elements */
        .card-title {
            font-size: 18px;
            font-weight: 500;
            color: #333;
            margin-top: 0;
        }
        
        .card-value {
            font-size: 48px;
            font-weight: 700;
            color: #333;
            margin: 10px 0;
        }
        
        .card-icon {
            font-size: 24px;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Yellow Gradient Cards</h1>
        
        <div class="cards-container">
            <!-- Card 1 -->
            <div class="card yellow-gradient-1">
                <h3 class="card-title">Requests</h3>
                <div class="card-value">12</div>
                <div class="card-icon">📋</div>
            </div>
            
            <!-- Card 2 -->
            <div class="card yellow-gradient-2">
                <h3 class="card-title">Booked</h3>
                <div class="card-value">8</div>
                <div class="card-icon">🏷️</div>
            </div>
            
            <!-- Card 3 -->
            <div class="card yellow-gradient-3">
                <h3 class="card-title">In Progress</h3>
                <div class="card-value">5</div>
                <div class="card-icon">⏳</div>
            </div>
            
            <!-- Card 4 -->
            <div class="card yellow-gradient-4">
                <h3 class="card-title">Completed</h3>
                <div class="card-value">23</div>
                <div class="card-icon">✅</div>
            </div>
        </div>
    </div>
</body>
</html>
