<!DOCTYPE html>
<html>
<head>
    <title>Direct PDF Download Test</title>
</head>
<body>
    <h1>Direct PDF Download Test</h1>
    <p>Click this button to download the PDF directly:</p>
    
    <form action="/booking/77/voucher" method="POST">
        <button type="submit" style="background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 5px; font-size: 16px;">
            Download PDF Now
        </button>
    </form>
    
    <p><strong>Or use this direct link:</strong></p>
    <a href="/booking/77/voucher" download="voucher.pdf" style="background: #28a745; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px;">
        GET Request Download
    </a>
    
    <script>
    // Force download using JavaScript
    function downloadPDF() {
        fetch('/booking/77/voucher', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
            }
        })
        .then(response => response.blob())
        .then(blob => {
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'voucher.pdf';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
        });
    }
    </script>
    
    <br><br>
    <button onclick="downloadPDF()" style="background: #dc3545; color: white; padding: 10px 20px; border: none; border-radius: 5px; font-size: 16px;">
        JavaScript Download
    </button>
</body>
</html>
