<!-- Customer Selection Modal -->
<div class="modal fade" id="customerSelectionModal" tabindex="-1" aria-labelledby="customerSelectionModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title" id="customerSelectionModalLabel">Select Customer</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <div class="input-group mb-3">
            <input type="text" id="customerSearchInput" class="form-control" placeholder="Search customers by name, email, or phone...">
            <button class="btn btn-outline-secondary" type="button" id="searchCustomerBtn">
              <i class="fas fa-search"></i>
            </button>
          </div>
        </div>
        
        <div class="table-responsive">
          <table class="table table-hover" id="customerTable">
            <thead>
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              {% for customer in customers %}
              <tr>
                <td>{{ customer.name }}</td>
                <td>{{ customer.email }}</td>
                <td>{{ customer.phone }}</td>
                <td>
                  <button type="button" class="btn btn-primary btn-sm select-customer" 
                          data-customer-id="{{ customer.id }}"
                          data-customer-name="{{ customer.name }}">
                    <i class="fas fa-check me-1"></i> Select
                  </button>
                </td>
              </tr>
              {% endfor %}
            </tbody>
          </table>
        </div>
        
        <!-- No results message -->
        <div id="noCustomersFound" class="alert alert-info {% if customers %}d-none{% endif %}">
          <i class="fas fa-info-circle me-2"></i> No customers found matching your search.
        </div>
        
        <!-- Quick add customer form -->
        <div class="card mt-3">
          <div class="card-header bg-light">
            <h5 class="card-title mb-0">Quick Add Customer</h5>
          </div>
          <div class="card-body">
            <form id="quickAddCustomerForm">
              <div class="row">
                <div class="col-md-6">
                  <div class="mb-3">
                    <label for="customerName" class="form-label">Customer Name</label>
                    <input type="text" class="form-control" id="customerName" required>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="mb-3">
                    <label for="customerEmail" class="form-label">Email</label>
                    <input type="email" class="form-control" id="customerEmail" required>
                  </div>
                </div>
              </div>
              <div class="row">
                <div class="col-md-6">
                  <div class="mb-3">
                    <label for="customerPhone" class="form-label">Phone</label>
                    <input type="tel" class="form-control" id="customerPhone">
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="mb-3">
                    <label for="customerType" class="form-label">Customer Type</label>
                    <select class="form-select" id="customerType">
                      <option value="INDIVIDUAL">Individual</option>
                      <option value="CORPORATE">Corporate</option>
                    </select>
                  </div>
                </div>
              </div>
              <button type="button" class="btn btn-success" id="saveQuickCustomerBtn">
                <i class="fas fa-plus-circle me-1"></i> Create & Select Customer
              </button>
            </form>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>

<script>
  // This script will be included when the modal is used
  document.addEventListener('DOMContentLoaded', function() {
    // Handle selecting a customer
    document.querySelectorAll('.select-customer').forEach(button => {
      button.addEventListener('click', function() {
        const customerId = this.getAttribute('data-customer-id');
        const customerName = this.getAttribute('data-customer-name');
        
        // Update the customer select dropdown and close modal
        const customerSelect = document.getElementById('customer-select');
        if (customerSelect) {
          customerSelect.value = customerId;
          
          // Create a new option if it doesn't exist
          if (!Array.from(customerSelect.options).some(option => option.value === customerId)) {
            const newOption = new Option(customerName, customerId, true, true);
            customerSelect.appendChild(newOption);
          }
          
          // Trigger change event for any listeners
          customerSelect.dispatchEvent(new Event('change'));
        }
        
        // Close the modal
        const modal = bootstrap.Modal.getInstance(document.getElementById('customerSelectionModal'));
        modal.hide();
      });
    });
    
    // Quick add customer
    document.getElementById('saveQuickCustomerBtn').addEventListener('click', function() {
      // Validate form
      const form = document.getElementById('quickAddCustomerForm');
      if (form.checkValidity()) {
        const customerData = {
          name: document.getElementById('customerName').value,
          email: document.getElementById('customerEmail').value,
          phone: document.getElementById('customerPhone').value,
          type: document.getElementById('customerType').value
        };
        
        // Send AJAX request to create customer
        fetch('/api/customers', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(customerData)
        })
        .then(response => response.json())
        .then(data => {
          if (data.success) {
            // Update customer select with new customer
            const customerSelect = document.getElementById('customer-select');
            const newOption = new Option(customerData.name, data.customer_id, true, true);
            customerSelect.appendChild(newOption);
            customerSelect.value = data.customer_id;
            customerSelect.dispatchEvent(new Event('change'));
            
            // Close modal
            const modal = bootstrap.Modal.getInstance(document.getElementById('customerSelectionModal'));
            modal.hide();
            
            // Show success message
            alert('Customer created successfully!');
          } else {
            alert('Error creating customer: ' + data.error);
          }
        })
        .catch(error => {
          console.error('Error:', error);
          alert('An error occurred while creating the customer.');
        });
      } else {
        form.reportValidity();
      }
    });
    
    // Customer search functionality
    document.getElementById('searchCustomerBtn').addEventListener('click', searchCustomers);
    document.getElementById('customerSearchInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        searchCustomers();
        e.preventDefault();
      }
    });
    
    function searchCustomers() {
      const searchTerm = document.getElementById('customerSearchInput').value.trim().toLowerCase();
      const table = document.getElementById('customerTable');
      const rows = table.querySelectorAll('tbody tr');
      let matchFound = false;
      
      rows.forEach(row => {
        const name = row.cells[0].textContent.toLowerCase();
        const email = row.cells[1].textContent.toLowerCase();
        const phone = row.cells[2].textContent.toLowerCase();
        
        if (name.includes(searchTerm) || email.includes(searchTerm) || phone.includes(searchTerm)) {
          row.style.display = '';
          matchFound = true;
        } else {
          row.style.display = 'none';
        }
      });
      
      // Show/hide no results message
      document.getElementById('noCustomersFound').classList.toggle('d-none', matchFound);
    }
  });
</script>
