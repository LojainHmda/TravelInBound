{% extends 'booking/forms/confirm_base_form.html' %}

{% block supplier_options %}
<option value="Direct">Direct Guide</option>
<option value="Local Agency">Local Agency</option>
<option value="Tour Company">Tour Company</option>
<option value="Hotel Concierge">Hotel Concierge</option>
<option value="Freelance">Freelance Guide</option>
<option value="Other">Other</option>
{% endblock %}

{% block form_fields %}
<!-- Guide Service Details -->
<div class="row mb-3">
    <div class="col-md-6">
        <label class="form-label">From Date <span class="text-danger">*</span></label>
        <input type="date" class="form-control" name="from_date" required value="{{ confirmation_data.get('from_date', '') }}">
    </div>
    <div class="col-md-6">
        <label class="form-label">To Date <span class="text-danger">*</span></label>
        <input type="date" class="form-control" name="to_date" required value="{{ confirmation_data.get('to_date', '') }}">
    </div>
</div>

<div class="row mb-3">
    <div class="col-md-8">
        <label class="form-label">Guide Name <span class="text-danger">*</span></label>
        <input type="text" class="form-control" name="guide_name" required value="{{ confirmation_data.get('guide_name', '') }}" placeholder="Enter guide's full name">
    </div>
    <div class="col-md-4">
        <label class="form-label">Language <span class="text-danger">*</span></label>
        <select class="form-control" name="language" required>
            <option value="">Select Language</option>
            <option value="English" {% if confirmation_data.get('language') == 'English' %}selected{% endif %}>English</option>
            <option value="Arabic" {% if confirmation_data.get('language') == 'Arabic' %}selected{% endif %}>Arabic</option>
            <option value="French" {% if confirmation_data.get('language') == 'French' %}selected{% endif %}>French</option>
            <option value="German" {% if confirmation_data.get('language') == 'German' %}selected{% endif %}>German</option>
            <option value="Spanish" {% if confirmation_data.get('language') == 'Spanish' %}selected{% endif %}>Spanish</option>
            <option value="Italian" {% if confirmation_data.get('language') == 'Italian' %}selected{% endif %}>Italian</option>
            <option value="Chinese" {% if confirmation_data.get('language') == 'Chinese' %}selected{% endif %}>Chinese</option>
            <option value="Japanese" {% if confirmation_data.get('language') == 'Japanese' %}selected{% endif %}>Japanese</option>
            <option value="Russian" {% if confirmation_data.get('language') == 'Russian' %}selected{% endif %}>Russian</option>
            <option value="Other" {% if confirmation_data.get('language') == 'Other' %}selected{% endif %}>Other</option>
        </select>
    </div>
</div>

<!-- Guide Qualifications & Details -->
<div class="row mb-3">
    <div class="col-md-6">
        <label class="form-label">Guide License/ID</label>
        <input type="text" class="form-control" name="guide_license" value="{{ confirmation_data.get('guide_license', '') }}" placeholder="Guide license or ID number">
    </div>
    <div class="col-md-6">
        <label class="form-label">Contact Phone</label>
        <input type="text" class="form-control" name="guide_phone" value="{{ confirmation_data.get('guide_phone', '') }}" placeholder="Guide contact number">
    </div>
</div>

<!-- Service Type -->
<div class="row mb-3">
    <div class="col-md-6">
        <label class="form-label">Service Type</label>
        <select class="form-control" name="service_type">
            <option value="">Select Service Type</option>
            <option value="Meet & Greet" {% if confirmation_data.get('service_type') == 'Meet & Greet' %}selected{% endif %}>Meet & Greet</option>
            <option value="Half Day Tour" {% if confirmation_data.get('service_type') == 'Half Day Tour' %}selected{% endif %}>Half Day Tour</option>
            <option value="Full Day Tour" {% if confirmation_data.get('service_type') == 'Full Day Tour' %}selected{% endif %}>Full Day Tour</option>
            <option value="Multi-Day Tour" {% if confirmation_data.get('service_type') == 'Multi-Day Tour' %}selected{% endif %}>Multi-Day Tour</option>
            <option value="Transfer Only" {% if confirmation_data.get('service_type') == 'Transfer Only' %}selected{% endif %}>Transfer Only</option>
            <option value="Airport Transfer" {% if confirmation_data.get('service_type') == 'Airport Transfer' %}selected{% endif %}>Airport Transfer</option>
        </select>
    </div>
    <div class="col-md-6">
        <label class="form-label">Meeting Location</label>
        <input type="text" class="form-control" name="meeting_location" value="{{ confirmation_data.get('meeting_location', '') }}" placeholder="Where to meet the guide">
    </div>
</div>

<!-- Tour Details -->
<div class="row mb-3">
    <div class="col-md-12">
        <label class="form-label">Tour Itinerary / Sites to Visit</label>
        <textarea class="form-control" name="tour_itinerary" rows="3" placeholder="List of sites, attractions, or activities to be covered">{{ confirmation_data.get('tour_itinerary', '') }}</textarea>
    </div>
</div>

<!-- Guide Report -->
<div class="row mb-3">
    <div class="col-md-12">
        <label class="form-label">Guide Report / Special Instructions</label>
        <textarea class="form-control" name="guide_report" rows="3" placeholder="Special instructions for the guide, customer preferences, accessibility needs, etc.">{{ confirmation_data.get('guide_report', '') }}</textarea>
    </div>
</div>

<!-- Timing Details -->
<div class="row mb-3">
    <div class="col-md-6">
        <label class="form-label">Start Time</label>
        <input type="time" class="form-control" name="start_time" value="{{ confirmation_data.get('start_time', '') }}">
    </div>
    <div class="col-md-6">
        <label class="form-label">Duration (hours)</label>
        <input type="number" class="form-control" name="duration_hours" min="1" max="24" step="0.5" value="{{ confirmation_data.get('duration_hours', '') }}" placeholder="e.g., 4">
    </div>
</div>
{% endblock %}
