<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Status Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .status-card {
            display: flex;
            align-items: center;
            padding: 1rem 1.25rem;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            color: #fff;
            transition: transform 0.2s ease;
            cursor: pointer;
        }

        .status-card:hover {
            transform: translateY(-2px);
        }

        .status-card .icon-box {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            padding: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 1rem;
            font-size: 1.5rem;
        }

        .status-card .count-text .count {
            font-size: 1.75rem;
            font-weight: 600;
        }

        .status-card .count-text .label {
            font-size: 0.95rem;
            opacity: 0.9;
        }

        /* Status Colors */
        .bg-request {
            background-color: #ff9800;
        }
        .bg-booked {
            background-color: #9c27b0;
        }
        .bg-progress {
            background-color: #2196f3;
        }
        .bg-completed {
            background-color: #4caf50;
        }
    </style>
</head>
<body>
    <div class="container my-5">
        <div class="row g-3">
            <!-- Booking Requests -->
            <div class="col-md-3">
                <div class="status-card bg-request">
                    <div class="icon-box">
                        <i class="fas fa-clipboard-list"></i>
                    </div>
                    <div class="count-text">
                        <div class="count">1</div>
                        <div class="label">Booking Requests</div>
                    </div>
                </div>
            </div>

            <!-- Invoiced Bookings -->
            <div class="col-md-3">
                <div class="status-card bg-booked">
                    <div class="icon-box">
                        <i class="fas fa-file-invoice-dollar"></i>
                    </div>
                    <div class="count-text">
                        <div class="count">1</div>
                        <div class="label">Invoiced Bookings</div>
                    </div>
                </div>
            </div>

            <!-- In Progress -->
            <div class="col-md-3">
                <div class="status-card bg-progress">
                    <div class="icon-box">
                        <i class="fas fa-cogs"></i>
                    </div>
                    <div class="count-text">
                        <div class="count">2</div>
                        <div class="label">In Progress</div>
                    </div>
                </div>
            </div>

            <!-- Completed Bookings -->
            <div class="col-md-3">
                <div class="status-card bg-completed">
                    <div class="icon-box">
                        <i class="fas fa-check-circle"></i>
                    </div>
                    <div class="count-text">
                        <div class="count">0</div>
                        <div class="label">Completed Bookings</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
